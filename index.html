<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Profile | Gemini Code Assist</title>
    <style>
      /* Modern CSS Reset and Variables */
      :root {
        --primary-color: #2563eb;
        --secondary-color: #64748b;
        --bg-color: #f8fafc;
        --text-color: #1e293b;
        --card-bg: #ffffff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        line-height: 1.6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      /* Layout Components */
      .card {
        background: var(--card-bg);
        padding: 2rem;
        border-radius: 12px;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
        max-width: 400px;
        width: 90%;
        text-align: center;
      }

      header img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin-bottom: 1rem;
        border: 3px solid var(--primary-color);
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }

      p {
        color: var(--secondary-color);
        margin-bottom: 1.5rem;
      }

      .cta-button {
        display: inline-block;
        background-color: var(--primary-color);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        transition: background-color 0.2s ease;
      }

      .cta-button:hover {
        background-color: #1d4ed8;
      }

      footer {
        margin-top: 1.5rem;
        font-size: 0.875rem;
        border-top: 1px solid #e2e8f0;
        padding-top: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header>
        <!-- Replace with a real image URL -->
        <img src="https://via.placeholder.com/100" alt="Profile Portrait" />
        <h1>Jane Doe</h1>
        <p>Full Stack Software Engineer & Technical Architect</p>
      </header>

      <section>
        <p>
          Specializing in building scalable web applications with React,
          Node.js, and modern cloud infrastructure.
        </p>
        <a href="mailto:hello@example.com" class="cta-button">Get In Touch</a>
      </section>

      <footer>&copy; 2023 Jane Doe. Built with Semantic HTML5.</footer>
    </main>

    <script>
      // Simple interactivity demonstration
      const button = document.querySelector(".cta-button");
      button.addEventListener("click", () => {
        console.log("Contact button clicked!");
      });
    </script>
  </body>
</html>
